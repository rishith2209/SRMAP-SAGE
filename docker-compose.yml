services:
  db:
    image: pgvector/pgvector:pg16
    container_name: srmap_sage_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srmap_sage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srmap_sage_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-srmap_sage_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - srmap_sage_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srmap_sage} -d ${POSTGRES_DB:-srmap_sage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: srmap_sage_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-srmap_sage}:${POSTGRES_PASSWORD:-srmap_sage_dev_secret}@db:5432/${POSTGRES_DB:-srmap_sage_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-srmap_sage}:${POSTGRES_PASSWORD:-srmap_sage_dev_secret}@db:5432/${POSTGRES_DB:-srmap_sage_db}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-srmap_sage_maintainer_key_2026}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: srmap_sage_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  srmap_sage_pgdata:
    driver: local
